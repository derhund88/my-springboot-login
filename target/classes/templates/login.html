<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h2 {
            text-align: center;
            margin-top: 40px;
        }

        form {
            width: 300px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #f9f9f9;
        }

        label {
            display: inline-block;
            width: 80px;
        }

        input {
            width: 180px;
            padding: 5px;
            margin: 5px 0;
        }

        button {
            width: 100%;
            padding: 8px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        p[th\\:if] {
            text-align: center;
            color: red;
        }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 15px;
            background-color: #f1f1f1;
            border-top: 1px solid #ddd;
            font-size: 14px;
        }

        footer a {
            color: #007bff;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<h2>Login</h2>

<form th:action="@{/login}" method="post">
    <label>Username:</label>
    <input type="text" name="username" required />
    <br/>
    <label>Password:</label>
    <input type="password" name="password" required />
    <br/>
    <button type="submit">Login</button>
</form>

<p th:if="${error}" th:text="${error}"></p>

<!-- Footer hardcode -->
<footer>
    &copy; 2025 <strong>my-springboot-login</strong> — Dikembangkan oleh
    <a href="https://github.com/derhund88" target="_blank" rel="noopener noreferrer">Derhund88</a>.
</footer>

</body>
</html>
